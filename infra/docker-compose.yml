services:
  postgres:
    image: postgres:16
    container_name: kairos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: kairos
      POSTGRES_DB: kairos_dev
    ports:
      - "5432:5432"
    # max_connections raised from the default 100: the S1.2/S1.6/S1.7 spike
    # scripts (RFC v1.0 §16) open up to 500 concurrent connections to test
    # real contention, not connection-pool exhaustion. Production sits behind
    # PgBouncer in transaction-pooling mode (RFC §6.3) so this is a
    # spike/dev-only setting, not a production sizing decision.
    command: ["postgres", "-c", "max_connections=600"]
    volumes:
      - kairos_pgdata:/var/lib/postgresql/data
      - ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # First background-worker infrastructure (Implementation Plan Phase 13;
  # RFC v1.0 §4.1, §4.3) — a LIVENESS dependency only. If this is down, no
  # correctness violation occurs: the exclusion constraint needs neither
  # Celery nor Redis. Only asynchronous liveness (rolling materialization,
  # tz re-materialization, later phases' waitlist cascade/hold reclamation)
  # pauses.
  redis:
    image: redis:7-alpine
    container_name: kairos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../backend
    container_name: kairos_celery_worker
    restart: unless-stopped
    command: ["celery", "-A", "kairos", "worker", "--loglevel=info"]
    environment:
      DJANGO_SETTINGS_MODULE: kairos.settings.dev
      DATABASE_URL: postgresql://kairos_app:kairos_app@postgres:5432/kairos_dev
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ../backend
    container_name: kairos_celery_beat
    restart: unless-stopped
    command: ["celery", "-A", "kairos", "beat", "--loglevel=info"]
    environment:
      DJANGO_SETTINGS_MODULE: kairos.settings.dev
      DATABASE_URL: postgresql://kairos_app:kairos_app@postgres:5432/kairos_dev
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  kairos_pgdata:
