[project]
name = "kairos"
version = "0.1.0"
description = "Kairos — concurrency-safe resource booking engine"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "psycopg[binary]>=3.3,<4",
    "dj-database-url>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
    "django-stubs[compatible-mypy]>=6.1,<6.2",
    "pytest>=9.1,<10",
    "pytest-django>=4.14,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairos"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.format]
# defaults

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
mypy_path = "."

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "kairos.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kairos.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
