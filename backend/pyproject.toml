[project]
name = "kairos"
version = "0.1.0"
description = "Kairos — concurrency-safe resource booking engine"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1,<6.2",
    "psycopg[binary]>=3.3,<4",
    "dj-database-url>=2.3,<3",
    "djangorestframework>=3.18,<3.19",
    "pyjwt[crypto]>=2.10,<3",
    # Pinned exactly, not a range (Implementation Plan Phase 10; Test Plan
    # TZ-03 Test A) — staleness must be a tracked, deliberate quantity, not
    # "whatever the base image/interpreter happened to ship." Windows and
    # many minimal Linux images have no system IANA database at all, so
    # `zoneinfo` depends on this package being present, not optional.
    "tzdata==2026.3",
    # First background-worker dependency (Implementation Plan Phase 13;
    # RFC v1.0 §4.1) — Redis broker, per RFC v1.0 §4.3's "Redis is a
    # liveness dependency, never a correctness one" (the exclusion
    # constraint needs neither Celery nor Redis to hold).
    "celery[redis]>=5.5,<6",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
    "django-stubs[compatible-mypy]>=6.1,<6.2",
    "djangorestframework-stubs>=3.18,<3.19",
    "celery-types>=0.26,<1",
    "pytest>=9.1,<10",
    "pytest-django>=4.14,<5",
    "pytest-cov>=7.0,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kairos"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.format]
# defaults

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
mypy_path = "."

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "kairos.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kairos.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]

# Coverage reporting (Implementation Plan Phase 28 Scope item 8: "wired
# into CI, with a documented target"). CI's own `test` job (.github/
# workflows/ci.yml) passes --cov explicitly rather than baking it into
# addopts here, so ad-hoc local runs of a single test file aren't forced
# through coverage instrumentation. The documented target itself —
# --cov-fail-under's actual number — lives in docs/test-plan-compliance.md
# alongside the measured baseline it was set from, not floated here.
[tool.coverage.run]
source = ["kairos"]
omit = [
    "*/migrations/*",
    "kairos/manage.py",
    "kairos/celery.py",
    "kairos/wsgi.py",
    "kairos/settings/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
