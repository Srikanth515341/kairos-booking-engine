name: CI

# Phase 3 (Implementation Plan §3): three jobs. `concurrency` is separate and
# named so a reviewer browsing PRs sees "concurrency ✓" on every single one —
# this project's central proof runs on every commit, not just at release time.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy (strict, kairos package)
        run: mypy kairos

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The standard postgres:16 image ships contrib modules compiled in;
        # btree_gist just needs `CREATE EXTENSION`, which the bookings
        # migration already does (BtreeGistExtension()) — no extra service
        # setup required beyond the image itself.
        image: postgres:16
        env:
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: kairos
          POSTGRES_DB: kairos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://kairos:kairos@localhost:5432/kairos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit + integration tests (with coverage)
        # Coverage target (Implementation Plan Phase 28 Scope item 8): 90%,
        # a few points below the 93% baseline measured when this was wired
        # up — see docs/test-plan-compliance.md for why 90 (not 93, not
        # 100) and why this job's own --ignore=tests/concurrency (already
        # in place since Phase 3) is what's actually measured, not a gap
        # introduced by adding coverage.
        run: pytest --ignore=tests/concurrency --cov=kairos --cov-report=term-missing --cov-report=xml --cov-fail-under=90 -v
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml

  concurrency:
    name: concurrency
    runs-on: ubuntu-latest
    env:
      DATABASE_URL_TEST: postgresql://kairos:kairos@localhost:5432/kairos_test
    steps:
      - uses: actions/checkout@v4
      - name: Start Postgres (max_connections=600)
        # A plain `docker run`, not the `services:` block above: GitHub
        # Actions services can't override the container's startup command,
        # and CONC-01 alone opens 200 simultaneous connections — well past
        # Postgres's default max_connections=100. Same setting as
        # infra/docker-compose.yml, for the same reason (spike/test-scale
        # concurrency, not a production sizing decision).
        run: |
          docker run -d --name kairos_ci_postgres \
            -e POSTGRES_USER=kairos -e POSTGRES_PASSWORD=kairos -e POSTGRES_DB=kairos_test \
            -p 5432:5432 \
            postgres:16 -c max_connections=600
          for i in $(seq 1 30); do
            docker exec kairos_ci_postgres pg_isready -U kairos && break
            sleep 1
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run the concurrency proof suite (CI tier)
        # RECLAIM-04 (Phase 17) and CONC-01's own full-scale form (Phase
        # 28, tests/concurrency/test_conc_01_full_scale.py — 100 runs at
        # N=200 plus the N=500 escalation) are both excluded deliberately,
        # not forgotten: Test Plan v1.0 §13 places both in the STAGING/
        # pre-release tier, not CI tier (this job's own CONC-01 at N=200 x
        # 10 runs, CONC-02-05, HOLD-01-03, WL-01-04, RECLAIM-01-03 ARE CI
        # tier and run here normally) — expensive enough that per-commit
        # execution would make CI unusable. Run manually before a release:
        # pytest tests/concurrency/test_reclaim_04.py -v -s
        # pytest tests/concurrency/test_conc_01_full_scale.py -v -s
        run: pytest tests/concurrency --ignore=tests/concurrency/test_reclaim_04.py --ignore=tests/concurrency/test_conc_01_full_scale.py -v

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    # Overrides the top-level `defaults.run.working-directory: backend` —
    # this is the one job that isn't Python/backend at all (Implementation
    # Plan Phase 23).
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: format check
        run: npm run format:check
      - name: test
        run: npm run test
      - name: build
        run: npm run build
